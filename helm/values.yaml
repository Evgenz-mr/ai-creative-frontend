replicaCount: 1

image:
  repository: ghcr.io/evgenz-mr/ai-creative-frontend
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 3000

ingress:
  enabled: true
  className: nginx
  host: ai-creative.local
  path: /

config:
  apiUrl: "http://ai-creative-backend:8080"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 384Mi
